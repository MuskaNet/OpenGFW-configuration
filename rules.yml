- name: Block ShadowSocks and Vmess
  action: block
  log: true
  expr: fet != nil && fet.yes && (port.dst >= 10000) && (port.dst <= 65535)

- name: Block Trojan
  action: block
  log: true
  expr: trojan != nil && trojan.yes && (port.dst >= 10000) && (port.dst <= 65535)

- name: Block Socks
  action: block
  log: true
  expr: socks != nil && socks.yes && (port.dst >= 10000) && (port.dst <= 65535)

- name: Block OpenVPN
  action: block
  log: true
  expr: openvpn != nil && openvpn.rx_pkt_cnt + openvpn.tx_pkt_cnt > 50 && (port.dst >= 10000) && (port.dst <= 65535)
